<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a73e8">
    <title>Topic — Corporate Announcements</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #f8f9fa;
            --surface: #ffffff;
            --surface-2: #f1f3f4;
            --text: #202124;
            --text-muted: #5f6368;
            --border: #dadce0;
            --border-light: #e8eaed;
            --primary: #1a73e8;
            --primary-fill: #1a73e8;
            --primary-text: #ffffff;
            --success: #1e8e3e;
            --danger: #d93025;
            --warning: #b06000;
            --input-bg: #ffffff;
            --header-bg: #f1f3f4;
            --row-hover: #f8f9fa;
            --shadow-1: 0 1px 2px rgba(60,64,67,0.1), 0 1px 3px 1px rgba(60,64,67,0.06);
            --shadow-2: 0 1px 3px rgba(60,64,67,0.15), 0 4px 8px 3px rgba(60,64,67,0.08);
            --focus-ring: 0 0 0 3px rgba(26,115,232,0.35);
        }
        body.dark {
            --bg: #000000;
            --surface: #121212;
            --surface-2: #1e1e1e;
            --text: #e8eaed;
            --text-muted: #b0b4b8;
            --border: #3c4043;
            --border-light: #2a2a2a;
            --primary: #8ab4f8;
            --primary-fill: #8ab4f8;
            --primary-text: #202124;
            --success: #81c995;
            --danger: #f28b82;
            --warning: #fdd663;
            --input-bg: #1e1e1e;
            --header-bg: #1e1e1e;
            --row-hover: #1a1a1a;
            --shadow-1: 0 1px 3px rgba(0,0,0,0.7), 0 1px 2px rgba(0,0,0,0.5);
            --shadow-2: 0 4px 8px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.5);
            --focus-ring: 0 0 0 3px rgba(138,180,248,0.45);
        }
        * { box-sizing: border-box; }
        html { background-color: var(--bg) !important; min-height: 100vh; margin: 0; padding: 0; }
        body {
            font-family: 'Roboto', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background-color: var(--bg) !important;
            color: var(--text);
            margin: 0;
            padding: 12px;
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .container { max-width: 100%; padding: 0; }
        .card {
            border-radius: 16px;
            background: var(--surface);
            box-shadow: var(--shadow-1);
            margin-bottom: 12px;
            padding: 16px;
            border: none;
            color: var(--text);
        }
        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding: 0 4px;
            gap: 8px;
        }
        .header-title-wrap {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
            min-width: 0;
        }
        .header-row h1 {
            font-size: 1.4rem;
            font-weight: 500;
            margin: 0;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }
        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
        }
        .back-link:hover { color: var(--primary); text-decoration: underline; }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .theme-toggle-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--surface-2);
            color: var(--text);
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-1);
            flex-shrink: 0;
            transition: background 0.15s;
        }
        .theme-toggle-btn:hover { background: var(--border); }
        .theme-toggle-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
        .header-btn {
            height: 44px;
            padding: 0 18px;
            border-radius: 22px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: var(--shadow-1);
            white-space: nowrap;
            transition: background 0.15s, border-color 0.15s;
        }
        .header-btn:hover { background: var(--surface-2); }
        .header-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
        .header-btn.logout:hover { border-color: var(--danger); color: var(--danger); }

        /* ── Info bar ── */
        .info-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .info-bar .info-item { display: flex; gap: 6px; align-items: baseline; }
        .info-bar .info-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.4px; opacity: 0.7; }
        .info-bar .info-value { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }

        /* ── Filter bar ── */
        .form-label {
            font-size: 0.7rem;
            margin-bottom: 3px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.3px;
            display: block;
            text-transform: uppercase;
        }
        .form-control-sm, .form-select-sm {
            font-size: 0.85rem;
            padding: 0.4rem 0.6rem;
            background: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            width: 100%;
        }
        .form-control-sm:focus, .form-select-sm:focus {
            background: var(--input-bg);
            color: var(--text);
            border-color: var(--primary);
            box-shadow: var(--focus-ring);
            outline: none;
        }
        .form-control-sm::placeholder { color: var(--text-muted); opacity: 0.7; }

        /* ── List container ── */
        .list-scroll {
            overflow-y: auto;
            max-height: 72vh;
            overflow-x: hidden;
            border-radius: 12px;
            border: 1px solid var(--border-light);
        }

        /* ── Date group header ── */
        .date-group {
            position: sticky;
            top: 0;
            z-index: 4;
            background: var(--header-bg);
            color: var(--text-muted);
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            border-top: 1px solid var(--border-light);
        }
        .date-group:first-child { border-top: none; }

        /* ── Announcement row ── */
        .ann-row {
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-light);
            background: var(--surface);
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }
        .ann-row:hover { background: var(--row-hover); }
        .ann-row:focus { outline: none; box-shadow: inset 3px 0 0 var(--primary); }

        /* Sticky symbol cell */
        .ann-symbol {
            position: sticky;
            left: 0;
            z-index: 2;
            flex: 0 0 140px;
            padding: 12px 14px;
            font-weight: 600;
            font-size: 0.85rem;
            background: var(--surface);
            border-right: 1px solid var(--border-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-shadow: 2px 0 3px -2px rgba(0,0,0,0.15);
        }
        .ann-row:hover > .ann-symbol { background: var(--row-hover); }

        .ann-symbol.impact-positive { color: var(--success); }
        .ann-symbol.impact-negative { color: var(--danger); }
        .ann-symbol.impact-neutral  { color: var(--text-muted); }

        /* Subject cell — horizontally scrollable */
        .ann-subject {
            flex: 1 1 auto;
            padding: 12px 14px;
            font-size: 0.85rem;
            color: var(--text);
            white-space: nowrap;
            min-width: 0;
        }
        .ann-subject .no-attachment {
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.75rem;
            margin-left: 6px;
        }

        /* Time chip on the right */
        .ann-time {
            flex: 0 0 70px;
            padding: 12px 14px 12px 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            text-align: right;
            white-space: nowrap;
        }

        /* Empty state */
        .empty-state {
            padding: 48px 20px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Toast */
        #toastContainer {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            pointer-events: none;
        }
        .toast-item {
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 0.85rem;
            box-shadow: var(--shadow-2);
            pointer-events: auto;
            min-width: 260px;
            text-align: center;
        }

        @media (max-width: 576px) {
            body { padding: 6px; }
            .card { padding: 12px; margin-bottom: 8px; border-radius: 12px; }
            .header-row h1 { font-size: 1.05rem; }
            .theme-toggle-btn { width: 38px; height: 38px; font-size: 0.9rem; }
            .header-btn { height: 38px; padding: 0 12px; font-size: 0.75rem; }
            .info-bar { gap: 12px; font-size: 0.78rem; }
            .ann-symbol { flex: 0 0 110px; padding: 10px; font-size: 0.8rem; }
            .ann-subject { padding: 10px; font-size: 0.8rem; }
            .ann-time { flex: 0 0 56px; padding: 10px 10px 10px 4px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="header-row">
        <div class="header-title-wrap">
            <a class="back-link" href="/announcements" id="backLink">← Back to summary</a>
            <h1 id="topicTitle">Loading…</h1>
        </div>
        <div class="header-actions">
            <button id="themeToggle" class="theme-toggle-btn" title="Toggle theme" aria-label="Toggle theme">☾</button>
            <button id="logoutBtn" class="header-btn logout" title="Log out">Logout</button>
        </div>
    </div>

    <!-- ── Info bar ── -->
    <div class="card" style="padding: 14px 18px;">
        <div class="info-bar">
            <div class="info-item">
                <span class="info-label">Range</span>
                <span class="info-value" id="rangeValue">—</span>
            </div>
            <div class="info-item">
                <span class="info-label">Total</span>
                <span class="info-value" id="totalValue">0</span>
            </div>
            <div class="info-item">
                <span class="info-label">Showing</span>
                <span class="info-value" id="showingValue">0</span>
            </div>
        </div>
    </div>

    <!-- ── Filters ── -->
    <div class="card">
        <div class="row g-2">
            <div class="col-6 col-md-2">
                <label class="form-label" for="daysFilter">Range</label>
                <select id="daysFilter" class="form-select form-select-sm">
                    <option value="7">7 days</option>
                    <option value="30">30 days</option>
                    <option value="90" selected>90 days</option>
                    <option value="180">6 months</option>
                    <option value="365">1 year</option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label" for="impactFilter">Impact</label>
                <select id="impactFilter" class="form-select form-select-sm">
                    <option value="All">All</option>
                    <option value="positive">Positive</option>
                    <option value="negative">Negative</option>
                    <option value="neutral">Neutral</option>
                </select>
            </div>
            <div class="col-12 col-md-3">
                <label class="form-label" for="symbolFilter">Symbol</label>
                <input type="text" id="symbolFilter" class="form-control-sm" placeholder="Optional" autocomplete="off">
            </div>
        </div>
    </div>

    <!-- ── List ── -->
    <div class="card" style="padding: 0;">
        <div class="list-scroll" id="listScroll">
            <div class="empty-state">Loading…</div>
        </div>
    </div>

</div>

<div id="toastContainer" aria-live="polite"></div>

<script>
// ── Topic name from URL path ──
const TOPIC = decodeURIComponent(
    window.location.pathname.replace(/^\/announcements\/topic\//, '')
);

// ── Fetch wrapper: 401 → /login ──
const originalFetch = window.fetch;
window.fetch = function (...args) {
    return originalFetch.apply(this, args).then(response => {
        if (response.status === 401) {
            window.location.href = '/login';
            return Promise.reject(new Error('Unauthorized'));
        }
        return response;
    });
};

// ── Theme toggle ──
const themeToggle = document.getElementById('themeToggle');
function applyTheme(theme) {
    if (theme === 'dark') {
        document.body.classList.add('dark');
        themeToggle.textContent = '☀';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#000000');
    } else {
        document.body.classList.remove('dark');
        themeToggle.textContent = '☾';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1a73e8');
    }
}
applyTheme(localStorage.getItem('annTheme') || 'light');
themeToggle.addEventListener('click', function () {
    const next = document.body.classList.contains('dark') ? 'light' : 'dark';
    applyTheme(next);
    localStorage.setItem('annTheme', next);
});

// ── Toast ──
function showToast(msg) {
    const c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = 'toast-item';
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => { if (t.parentNode) t.remove(); }, 3500);
}

// ── Logout ──
document.getElementById('logoutBtn').addEventListener('click', function () {
    originalFetch('/api/logout', { method: 'POST' })
        .finally(() => { window.location.href = '/login'; });
});

// ── Load state from URL ──
(function loadFromUrl() {
    const p = new URLSearchParams(location.search);
    const d = p.get('days');
    const i = p.get('impact');
    const s = p.get('symbol');
    if (d) document.getElementById('daysFilter').value = d;
    if (i) document.getElementById('impactFilter').value = i;
    if (s) document.getElementById('symbolFilter').value = s;
})();

// ── Save state to URL ──
function saveStateToUrl() {
    const p = new URLSearchParams();
    p.set('days', document.getElementById('daysFilter').value);
    p.set('impact', document.getElementById('impactFilter').value);
    const s = document.getElementById('symbolFilter').value.trim();
    if (s) p.set('symbol', s);
    history.replaceState(null, '', location.pathname + '?' + p.toString());
}

// ── Date formatting ──
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WEEKDAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function formatDateGroupKey(dateStr) {
    // '2026-10-11' → '11 Oct 2026 (Sat)'
    if (!dateStr) return '';
    try {
        const [y, mo, d] = dateStr.split('-').map(n => parseInt(n));
        const dt = new Date(Date.UTC(y, mo - 1, d));
        return `${d} ${MONTHS[mo - 1]} ${y} (${WEEKDAYS[dt.getUTCDay()]})`;
    } catch (e) { return dateStr; }
}

function formatTimeOnly(dateTimeStr) {
    // '2026-10-11 14:30:00' → '14:30'
    if (!dateTimeStr) return '';
    try {
        const [_, time] = dateTimeStr.split(' ');
        return time ? time.slice(0, 5) : '';
    } catch (e) { return ''; }
}

function formatRangeLabel(days) {
    const d = parseInt(days);
    const end = new Date();
    const start = new Date(Date.now() - d * 86400000);
    const fmt = (dt) => `${dt.getDate()} ${MONTHS[dt.getMonth()]} ${dt.getFullYear()}`;
    return `${fmt(start)} – ${fmt(end)}`;
}

// ── Escape HTML ──
function escapeHtml(s) {
    return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

// ── Render list ──
function renderList(rows) {
    const container = document.getElementById('listScroll');
    if (!rows || rows.length === 0) {
        container.innerHTML = `<div class="empty-state">No announcements in this range.</div>`;
        return;
    }

    // Group by date (YYYY-MM-DD)
    const groups = new Map();
    for (const r of rows) {
        const day = (r.announced_at || '').split(' ')[0] || 'unknown';
        if (!groups.has(day)) groups.set(day, []);
        groups.get(day).push(r);
    }

    let html = '';
    for (const [day, items] of groups) {
        html += `<div class="date-group">${escapeHtml(formatDateGroupKey(day))}</div>`;
        for (const r of items) {
            const impactClass = 'impact-' + (r.impact || 'neutral');
            const hasAttachment = !!(r.attachment && r.attachment.trim());
            const subjectEsc = escapeHtml(r.subject || '');
            const symbolEsc = escapeHtml(r.symbol || '');
            const timeStr = formatTimeOnly(r.announced_at);

            if (hasAttachment) {
                html += `
                    <a class="ann-row" href="${escapeHtml(r.attachment)}" target="_blank" rel="noopener">
                        <div class="ann-symbol ${impactClass}">${symbolEsc}</div>
                        <div class="ann-subject">${subjectEsc}</div>
                        <div class="ann-time">${timeStr}</div>
                    </a>`;
            } else {
                html += `
                    <div class="ann-row" style="cursor:default;">
                        <div class="ann-symbol ${impactClass}">${symbolEsc}</div>
                        <div class="ann-subject">${subjectEsc}<span class="no-attachment">(no PDF on NSE)</span></div>
                        <div class="ann-time">${timeStr}</div>
                    </div>`;
            }
        }
    }
    container.innerHTML = html;
}

// ── Load data ──
async function loadList() {
    const days = document.getElementById('daysFilter').value;
    const impact = document.getElementById('impactFilter').value;
    const symbol = document.getElementById('symbolFilter').value.trim();

    document.getElementById('rangeValue').textContent = formatRangeLabel(days);
    document.getElementById('backLink').href =
        '/announcements?days=' + days
        + '&impact=' + encodeURIComponent(impact)
        + (symbol ? '&symbol=' + encodeURIComponent(symbol) : '');

    const url = `/api/announcements/topic/${encodeURIComponent(TOPIC)}`
              + `?days=${days}`
              + `&impact=${encodeURIComponent(impact)}`
              + (symbol ? `&symbol=${encodeURIComponent(symbol)}` : '');

    try {
        const r = await fetch(url);
        if (!r.ok) {
            document.getElementById('listScroll').innerHTML =
                `<div class="empty-state" style="color:var(--danger);">Failed to load.</div>`;
            return;
        }
        const data = await r.json();
        document.getElementById('totalValue').textContent = (data.rows || []).length.toLocaleString();
        document.getElementById('showingValue').textContent = (data.rows || []).length.toLocaleString();
        renderList(data.rows || []);
    } catch (e) {
        document.getElementById('listScroll').innerHTML =
            `<div class="empty-state" style="color:var(--danger);">Network error.</div>`;
    }
}

// ── Filters ──
document.getElementById('daysFilter').addEventListener('change', () => {
    saveStateToUrl();
    loadList();
});
document.getElementById('impactFilter').addEventListener('change', () => {
    saveStateToUrl();
    loadList();
});
let symbolDebounce = null;
document.getElementById('symbolFilter').addEventListener('input', () => {
    clearTimeout(symbolDebounce);
    symbolDebounce = setTimeout(() => {
        saveStateToUrl();
        loadList();
    }, 350);
});

// ── Boot ──
document.getElementById('topicTitle').textContent = TOPIC;
document.title = `${TOPIC} — Corporate Announcements`;
loadList();
</script>
</body>
</html>
